<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Comunitaria - Gestión de Viajes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <!-- Barra superior -->
        <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-white shadow-sm rounded">
            <h2>Panel de Viajes (Servicio B)</h2>
            <div>
                <span class="text-muted">Usuario Activo:</span>
                <strong id="nombreUsuarioText" class="text-primary">Cargando...</strong>
            </div>
        </div>

        <div class="row">
            <!-- Formulario de Registro -->
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title mb-3">Registrar Viaje</h4>
                        <form id="viajeForm">
                            <div class="mb-3">
                                <label class="form-label">Ciudad de Destino:</label>
                                <select class="form-select" id="ciudadSelect" required>
                                    <option value="">Cargando ciudades...</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Fecha:</label>
                                <input type="date" class="form-control" id="fechaViaje" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Motivo:</label>
                                <input type="text" class="form-control" id="motivo" placeholder="Ej. Vacaciones, Visita técnica">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Guardar Viaje</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Viajes -->
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title mb-3">Mis Viajes Registrados</h4>
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Ciudad</th>
                                        <th>País</th>
                                        <th>Fecha</th>
                                        <th>Motivo</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaViajesBody">
                                    <tr><td colspan="4" class="text-center">Cargando viajes...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Vinculamos el archivo JavaScript externo -->
    <script src="/js/app.js"></script>
</body>
</html>
